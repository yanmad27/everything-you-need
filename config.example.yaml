# Everything You Need - Example Configuration
# Copy this file to config.yaml and modify according to your needs

app:
  name: "Everything You Need"
  environment: "production" # development, staging, production
  log_level: "info" # debug, info, warn, error

# Configure price sources
price_sources:
  doji:
    enabled: true
    # Price table behind https://banggia.doji.vn/gold-price (no API key needed).
    api_url: "https://banggia.doji.vn/api/TablePrice/GetTablePrice"

# Telegram notifications (optional)
telegram:
  enabled: true
  bot_token: "your-telegram-bot-token"
  channel_id: "@your_channel_or_chat_id"
  # Required for the reminder bot webhook. Generate with: openssl rand -hex 32
  webhook_secret: ""
  webhook_path: "/telegram-webhook"

# Zalo Bot Platform (optional): same chat assistant + reminders as Telegram.
# See docs/zalo-service.md
zalo:
  enabled: false
  bot_token: "your-zalo-bot-token"
  # 8-256 chars; Zalo echoes it in the X-Bot-Api-Secret-Token header.
  # Generate with: openssl rand -hex 32
  webhook_secret: ""
  webhook_path: "/zalo-webhook"
  # Comma-separated Zalo chat ids allowed to use the due_dates tool (private data).
  # Empty = the tool is unavailable. ZALO_PRIVATE_TOOL_CHATS overrides.
  private_tool_chats: ""

# OpenAI-compatible LLM used ONLY by the Zalo bot (chat + reminder parsing).
# Unused unless base_url and api_key are both set; otherwise Zalo falls back to
# the Anthropic client (chat.api_key / reminder.openai_api_key). Telegram is unaffected.
llm_openai:
  base_url: "https://your-openai-compatible-host"   # /v1/chat/completions is appended
  api_key: "your-api-key"
  model: "gpt-6-sol"

# Vietnamese natural-language reminder bot (optional)
reminder:
  enabled: false
  db_path: "data/reminders.db"
  openai_api_key: ""
  openai_model: "gpt-5"
  retention_days: 30
  max_lookahead_days: 365

# Daily bilingual (EN+VN) news digest posted to the Telegram channel at 8PM ICT.
# Sources are curated RSS feeds; OpenAI ranks the hottest items and writes the
# summaries. Reuses reminder.openai_api_key when news.openai_api_key is empty.
# Zalo conversation store for the admin UI (messages, tool calls, usage). Zalo only.
# Read-only admin UI at /admin. Enabled only when BOTH are set; no default password.
# Generate the hash with: go run ./cmd/adminhash
admin:
  username: "" # -> ADMIN_USERNAME
  password_hash: "" # -> ADMIN_PASSWORD_HASH (bcrypt, cost >= 10)
  password_hash_b64: "" # -> ADMIN_PASSWORD_HASH_B64 (base64 of the bcrypt hash; no `$`, preferred for compose/Dokploy)
  session_secret: "" # -> ADMIN_SESSION_SECRET (optional; random per process if empty)
  password_reset: false # -> ADMIN_PASSWORD_RESET (true clears the UI-changed password at startup; the env hash applies again)

convo:
  enabled: true # -> CONVO_ENABLED
  db_path: "data/convo.db" # -> CONVO_DB_PATH
  retention_days: 90 # -> CONVO_RETENTION_DAYS
  price_prompt_per_1k: 0 # -> CONVO_PRICE_PROMPT_PER_1K (legacy fallback for models without a price below; 0 = none)
  price_completion_per_1k: 0 # -> CONVO_PRICE_COMPLETION_PER_1K
  currency: "USD" # -> CONVO_CURRENCY (label only)
  # Per-model prices per 1M tokens (no defaults: a model without a price shows "price not configured").
  # Env form (overrides per model): CONVO_PRICES="model-a:1.25:10,model-b:1:5" = model:prompt:completion
  prices: []
  #  - {model: "model-a", prompt_per_1m: 1.25, completion_per_1m: 10}

news:
  enabled: true
  db_path: "data/news.db"
  openai_api_key: "" # falls back to reminder.openai_api_key when empty
  openai_model: "gpt-5"
  max_items: 7
  window_hours: 24
  dedup_days: 7
  feeds:
    - "https://news.ycombinator.com/rss"
    - "https://techcrunch.com/feed/"
    - "https://www.theverge.com/rss/index.xml"
    - "http://feeds.arstechnica.com/arstechnica/index"
    - "https://vnexpress.net/rss/so-hoa.rss"
    - "https://vnexpress.net/rss/tin-moi-nhat.rss"

# HTTP server for the Telegram / Zalo webhooks (used when reminder or chat is enabled)
server:
  listen_addr: ":8080"

# Environment variable examples:
# APP_NAME="My Price Tracker"
# APP_ENVIRONMENT="production"
# PRICE_SOURCES_DOJI_API_KEY="your-api-key"
# TELEGRAM_ENABLED="true"
# TELEGRAM_BOT_TOKEN="1234567890:ABCdef..."
# TELEGRAM_CHANNEL_ID="@mychannel"
# TELEGRAM_WEBHOOK_SECRET="<random-hex-string>"
# LLM_OPENAI_BASE_URL="https://your-openai-compatible-host"
# LLM_OPENAI_API_KEY="<api-key>"
# LLM_OPENAI_MODEL="gpt-6-sol"
# ZALO_ENABLED="true"
# ZALO_BOT_TOKEN="<zalo-bot-token>"
# ZALO_WEBHOOK_SECRET="<random-hex-string>"
# REMINDER_ENABLED="true"
# REMINDER_OPENAI_API_KEY="<your-openai-api-key>"

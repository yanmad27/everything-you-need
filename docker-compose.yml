services:
  price-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: everything-you-need:latest
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Secrets supplied by Dokploy Compose env; override the blanks in config.yaml.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - NEWS_OPENAI_API_KEY=${NEWS_OPENAI_API_KEY}
      - NEWS_SERPER_API_KEY=${NEWS_SERPER_API_KEY}
      - REMINDER_OPENAI_API_KEY=${REMINDER_OPENAI_API_KEY}
      - PRICE_SOURCES_DOJI_API_URL=${PRICE_SOURCES_DOJI_API_URL}
      - PRICE_SOURCES_BTMC_API_URL=${PRICE_SOURCES_BTMC_API_URL}
    volumes:
      - eyn-data:/root/data
      - eyn-logs:/root/logs
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "./main"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  smee-client:
    image: deltaprojects/smee-client
    restart: unless-stopped
    command:
      - "-u"
      - "https://smee.io/2iKk7zcT8arhn5WB"
      - "-t"
      - "http://price-tracker:8080/telegram-webhook"
    depends_on:
      - price-tracker

volumes:
  eyn-data:
  eyn-logs:

services:
  price-tracker:
    image: ghcr.io/yanmad27/everything-you-need:latest
    pull_policy: always
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Secrets supplied by Dokploy Compose env; override the blanks in config.yaml.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - NEWS_OPENAI_API_KEY=${NEWS_OPENAI_API_KEY}
      - NEWS_SERPER_API_KEY=${NEWS_SERPER_API_KEY}
      - REMINDER_OPENAI_API_KEY=${REMINDER_OPENAI_API_KEY}
      # Zalo bot (off unless ZALO_ENABLED=true). Empty values fall back to the
      # config.yaml / built-in defaults (empty env vars are treated as unset).
      - ZALO_ENABLED=${ZALO_ENABLED:-false}
      - ZALO_BOT_TOKEN=${ZALO_BOT_TOKEN}
      - ZALO_WEBHOOK_SECRET=${ZALO_WEBHOOK_SECRET}
      - ZALO_WEBHOOK_PATH=${ZALO_WEBHOOK_PATH:-/zalo-webhook}
      - ZALO_PRIVATE_TOOL_CHATS=${ZALO_PRIVATE_TOOL_CHATS:-}
      - CHAT_FETCH_ALLOW_DOMAINS=${CHAT_FETCH_ALLOW_DOMAINS:-}
      # Admin UI at /admin (off unless both username and bcrypt hash are set).
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ADMIN_PASSWORD_HASH_B64=${ADMIN_PASSWORD_HASH_B64:-}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
      - ADMIN_PASSWORD_RESET=${ADMIN_PASSWORD_RESET:-}
      # Zalo conversation store for the admin UI (stored on the data volume).
      - CONVO_ENABLED=${CONVO_ENABLED:-true}
      - CONVO_RETENTION_DAYS=${CONVO_RETENTION_DAYS:-90}
      - CONVO_PRICE_PROMPT_PER_1K=${CONVO_PRICE_PROMPT_PER_1K:-0}
      - CONVO_PRICE_COMPLETION_PER_1K=${CONVO_PRICE_COMPLETION_PER_1K:-0}
      # Per-model prices per 1M tokens: "model:prompt:completion,..." (empty = cost "price not configured").
      - CONVO_PRICES=${CONVO_PRICES:-}
      - CONVO_CURRENCY=${CONVO_CURRENCY:-USD}
      # OpenAI-compatible LLM for the Zalo bot only (optional).
      - LLM_OPENAI_BASE_URL=${LLM_OPENAI_BASE_URL}
      - LLM_OPENAI_API_KEY=${LLM_OPENAI_API_KEY}
      - LLM_OPENAI_MODEL=${LLM_OPENAI_MODEL}
      # Doji needs no key since the banggia.doji.vn migration; its URL is baked
      # into config.yaml so a stale dashboard var can't override it.
      - PRICE_SOURCES_BTMC_API_URL=${PRICE_SOURCES_BTMC_API_URL}
    volumes:
      - eyn-data:/root/data
      - eyn-logs:/root/logs
    expose:
      - "8080"
    networks:
      # Joins Dokploy's Traefik network so a domain can route to the webhook.
      - dokploy-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "./main"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  eyn-data:
  eyn-logs:

networks:
  dokploy-network:
    external: true

services:
  price-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: everything-you-need:latest
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # Secrets supplied by Dokploy Compose env; override the blanks in config.yaml.
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - NEWS_OPENAI_API_KEY=${NEWS_OPENAI_API_KEY}
      - NEWS_SERPER_API_KEY=${NEWS_SERPER_API_KEY}
      - REMINDER_OPENAI_API_KEY=${REMINDER_OPENAI_API_KEY}
      # Doji needs no key since the banggia.doji.vn migration; its URL is baked
      # into config.yaml so a stale dashboard var can't override it.
      - PRICE_SOURCES_BTMC_API_URL=${PRICE_SOURCES_BTMC_API_URL}
    volumes:
      - eyn-data:/root/data
      - eyn-logs:/root/logs
    expose:
      - "8080"
    networks:
      # Joins Dokploy's Traefik network so a domain can route to the webhook.
      - dokploy-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "./main"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  eyn-data:
  eyn-logs:

networks:
  dokploy-network:
    external: true

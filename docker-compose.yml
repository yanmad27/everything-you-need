services:
  price-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: everything-you-need:latest
    container_name: price-tracker-bot
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./config.yaml:/root/config.yaml:ro
      - ./logs:/root/logs
      - ./data:/root/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "pgrep", "-f", "./main"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  smee-client:
    image: deltaprojects/smee-client
    container_name: smee-client
    restart: unless-stopped
    command:
      - "-u"
      - "https://smee.io/2iKk7zcT8arhn5WB"
      - "-t"
      - "http://price-tracker:8080/telegram-webhook"
    depends_on:
      - price-tracker

networks:
  default:
    name: price-tracker-network
services:
  price-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: everything-you-need:latest
    container_name: price-tracker-bot
    restart: unless-stopped
    volumes:
      - ./config.yaml:/root/config.yaml:ro
      - ./logs:/root/logs
    healthcheck:
      test: ["CMD", "pgrep", "-f", "./main"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: price-tracker-network
# Everything You Need - Example Configuration
# Copy this file to config.yaml and modify according to your needs

app:
  name: "Everything You Need"
  environment: "production" # development, staging, production
  log_level: "info" # debug, info, warn, error

# Configure price sources
price_sources:
  doji:
    enabled: true
    api_url: "http://giavang.doji.vn/api/giavang/?api_key=258fbd2a72ce8481089d88c678e9fe4f"
  btmc:
    enabled: true
    api_url: "http://api.btmc.vn/api/BTMCAPI/getpricebtmc?key=3kd8ub1llcg9t45hnoh8hmn7t5kc2v"
  mihong:
    enabled: true
    base_url: "https://www.mihong.vn/vi/gia-vang-trong-nuoc"
    api_url: "https://www.mihong.vn/api/v1/gold/prices/current"
  coingecko:
    enabled: true
    api_url: "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,binancecoin&vs_currencies=usd"

# Telegram notifications (optional)
telegram:
  enabled: true
  bot_token: "8275670284:AAECfL45PycZ8tYNRIw-mVRuAqzP8Hqn3RQ"
  channel_id: "-1002923319232"

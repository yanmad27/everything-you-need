# Committed, non-secret config baked into the Docker image as config.yaml.
# Secret fields are left blank on purpose and are supplied at runtime via
# environment variables (Dokploy Compose env). Viper's AutomaticEnv overrides
# these blanks, e.g. NEWS_SERPER_API_KEY -> news.serper_api_key.
# The list values (feeds, search_queries) cannot be env vars, so they live here.

app:
  name: "Everything You Need"
  environment: "production"
  log_level: "info"

price_sources:
  doji:
    enabled: true
    api_url: "https://banggia.doji.vn/api/TablePrice/GetTablePrice"
  btmc:
    enabled: true
    api_url: "" # -> PRICE_SOURCES_BTMC_API_URL (embeds api key)
  mihong:
    enabled: true
    base_url: "https://mihong.com/gia-vang-trong-nuoc"
    api_url: "https://api.mihong.com/v1/gold-prices?market=domestic"
  kimkhoa:
    enabled: true
    url: "https://tuanquangdong.com/gia-vang/kim-khoa-cam-ranh/"
  coingecko:
    enabled: true
    api_url: "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,binancecoin&vs_currencies=usd"

telegram:
  enabled: true
  bot_token: "" # -> TELEGRAM_BOT_TOKEN
  channel_id: "-1002923319232"
  webhook_secret: "" # -> TELEGRAM_WEBHOOK_SECRET
  webhook_path: "/telegram-webhook"

# Zalo Bot Platform (optional; same reminder + chat features as Telegram)
zalo:
  enabled: false # set true via ZALO_ENABLED
  bot_token: "" # -> ZALO_BOT_TOKEN
  webhook_secret: "" # -> ZALO_WEBHOOK_SECRET
  webhook_path: "/zalo-webhook"
  private_tool_chats: "" # -> ZALO_PRIVATE_TOOL_CHATS (comma-separated chat ids allowed to use the due_dates tool)

# OpenAI-compatible LLM used ONLY by the Zalo bot (chat + reminder parsing).
# Unused unless base_url and api_key are both set; Telegram stays on Claude.
llm_openai:
  base_url: "" # -> LLM_OPENAI_BASE_URL
  api_key: "" # -> LLM_OPENAI_API_KEY
  model: "gpt-6-sol" # -> LLM_OPENAI_MODEL

reminder:
  enabled: true
  db_path: "data/reminders.db"
  openai_api_key: "" # -> REMINDER_OPENAI_API_KEY
  openai_model: "claude-haiku-4-5"
  retention_days: 30
  max_lookahead_days: 365

# Zalo conversation store for the admin UI (messages, tool calls, usage). Zalo only.
# Read-only admin UI at /admin. Enabled only when BOTH are set; no default password.
# Generate the hash with: go run ./cmd/adminhash
admin:
  username: "" # -> ADMIN_USERNAME
  password_hash: "" # -> ADMIN_PASSWORD_HASH (bcrypt, cost >= 10)
  password_hash_b64: "" # -> ADMIN_PASSWORD_HASH_B64 (base64 of the bcrypt hash; no `$`, preferred for compose/Dokploy)
  session_secret: "" # -> ADMIN_SESSION_SECRET (optional; random per process if empty)
  password_reset: "" # -> ADMIN_PASSWORD_RESET (exactly "true" clears the UI-changed password at startup; the env hash applies again)

convo:
  enabled: true # -> CONVO_ENABLED
  db_path: "data/convo.db" # -> CONVO_DB_PATH
  retention_days: 90 # -> CONVO_RETENTION_DAYS
  price_prompt_per_1k: 0 # -> CONVO_PRICE_PROMPT_PER_1K (legacy fallback for models without a price below; 0 = none)
  price_completion_per_1k: 0 # -> CONVO_PRICE_COMPLETION_PER_1K
  currency: "USD" # -> CONVO_CURRENCY (label only)
  # Per-model prices per 1M tokens (no defaults: a model without a price shows "price not configured").
  # Env form (overrides per model): CONVO_PRICES="model-a:1.25:10,model-b:1:5" = model:prompt:completion
  prices: []
  #  - {model: "model-a", prompt_per_1m: 1.25, completion_per_1m: 10}

news:
  enabled: true
  db_path: "data/news.db"
  openai_api_key: "" # -> NEWS_OPENAI_API_KEY
  openai_model: "claude-haiku-4-5"
  serper_api_key: "" # -> NEWS_SERPER_API_KEY
  # Filter off: general hottest AI/tech/VN news, no topic search.
  search_queries: []
  max_items: 7
  window_hours: 24
  dedup_days: 7
  feeds:
    - "https://vnexpress.net/rss/tin-moi-nhat.rss"
    - "https://vnexpress.net/rss/so-hoa.rss"
    - "https://tuoitre.vn/rss/tin-moi-nhat.rss"
    - "https://news.ycombinator.com/rss"
    - "https://techcrunch.com/feed/"
    - "https://www.theverge.com/rss/index.xml"
    - "http://feeds.arstechnica.com/arstechnica/index"

server:
  listen_addr: ":8080"

# Chat with the bot ("Trợ lý Pink") — messages starting with a wake word
# (pink / trợ lý / troly) go to the LLM. api_key falls back to the reminder key.
chat:
  enabled: true
  api_key: "" # -> CHAT_OPENAI_API_KEY (falls back to reminder.openai_api_key)
  model: "claude-haiku-4-5"

# Daily 08:00 ICT scan of the wedding MASTER PLAN sheet's Due Date column.
# Posts a Telegram digest for tasks due in 1 month / 2 weeks / 1 week / 3 days /
# 1 day / today. Skips rows with Status = Done.
duedate:
  enabled: true
  csv_url: "https://docs.google.com/spreadsheets/d/1PutenOr1SZNTCc89K-ZJx5bEmlhJ3lrHbTytshohxv0/export?format=csv&gid=624467204"
  state_path: "data/duedate_sent.txt"

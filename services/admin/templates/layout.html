{{define "head"}}<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>{{.Title}} · Pink admin</title>
<style nonce="{{.Nonce}}">{{.CSS}}</style></head><body>
{{if .CSRF}}{{if ne .Nav ""}}<header><b>Pink admin</b>
<a href="/admin/chats"{{if eq .Nav "chats"}} class="on"{{end}}>Hội thoại</a>
<a href="/admin/users"{{if eq .Nav "users"}} class="on"{{end}}>Người dùng</a>
<a href="/admin/chat-stats"{{if eq .Nav "chatstats"}} class="on"{{end}}>Theo chat</a>
<a href="/admin/tools"{{if eq .Nav "tools"}} class="on"{{end}}>Công cụ</a>
<form method="post" action="/admin/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button type="submit">Đăng xuất</button></form></header>{{end}}{{end}}
<main>{{end}}
{{define "foot"}}</main></body></html>{{end}}
{{define "filters"}}<form class="f" method="get">
{{if .Q.Get "id"}}<input type="hidden" name="id" value="{{.Q.Get "id"}}">{{end}}
<label>Nền tảng<select name="platform"><option value="">tất cả</option><option value="zalo"{{if eq (.Q.Get "platform") "zalo"}} selected{{end}}>zalo</option><option value="telegram"{{if eq (.Q.Get "platform") "telegram"}} selected{{end}}>telegram</option></select></label>
<label>Tìm kiếm<input name="q" value="{{.Q.Get "q"}}" maxlength="100"></label>
<label>Từ ngày<input type="date" name="from" value="{{.Q.Get "from"}}"></label>
<label>Đến ngày<input type="date" name="to" value="{{.Q.Get "to"}}"></label>
<button type="submit">Lọc</button></form>{{end}}

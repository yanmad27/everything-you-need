{{template "head" .}}<div class="ph"><div><h1>{{.Title}}</h1><p class="mut">Đổi mật khẩu sẽ đăng xuất các phiên khác.</p></div></div>
<form class="card form pwd" method="post" action="/admin/password">
{{if .Data.Saved}}<p class="alert ok" role="status">Đã đổi mật khẩu. Các phiên đăng nhập khác đã bị đăng xuất.</p>{{end}}
{{if .Data.Error}}<p class="alert bad" role="alert">{{.Data.Error}}</p>{{end}}
<input type="hidden" name="csrf" value="{{.CSRF}}">
<div class="fld"><label for="cur">Mật khẩu hiện tại</label><input id="cur" name="current" type="password" autocomplete="current-password" required maxlength="200"></div>
<div class="fld"><label for="new">Mật khẩu mới</label><input id="new" name="new" type="password" autocomplete="new-password" required minlength="{{.Data.MinLen}}" maxlength="{{.Data.MaxLen}}" aria-describedby="pwh"></div>
<div class="fld"><label for="cf">Nhập lại mật khẩu mới</label><input id="cf" name="confirm" type="password" autocomplete="new-password" required maxlength="{{.Data.MaxLen}}"></div>
<p class="hint" id="pwh">{{.Data.Hint}}; tối đa {{.Data.MaxLen}} byte.</p>
<button class="btn" type="submit">Đổi mật khẩu</button></form>
{{template "foot" .}}

name: Test

on:
  issues:
    types: [opened]

jobs:
  test_noti:
    runs-on: ubuntu-latest
    steps:
      - name: noti
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          LABELS=$(echo '${{ toJSON(github.event.issue.labels) }}' | jq -r '.[].name' | paste -sd "," -)
          if [ -z "$LABELS" ]; then
            LABELS="none"
          fi
          MESSAGE="Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}\nLabels: ${LABELS}\nURL: ${ISSUE_URL}"
          curl -X POST 'https://api.telegram.org/bot***REMOVED***/sendMessage' \
            -H 'Content-Type: application/json' \
            -d "{\"chat_id\": \"-1002923319232\",\"text\": \"${MESSAGE}\"}"
